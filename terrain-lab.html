<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>지형 실험실</title>
  <style>
    :root { --bg: #111017; --panel: #1b1924; --line: #34304a; --ink: #ece6d6; --dim: #a39c8c; --ok: #7fdc8a; --bad: #ff7a6a; --accent: #e8c46a; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 "Galmuri11", system-ui, sans-serif; }
    header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: end; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
    header h1 { margin: 0 12px 0 0; font-size: 18px; color: var(--accent); }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--dim); }
    select, input, button { font: inherit; color: var(--ink); background: #25222f; border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
    input { width: 150px; }
    button { cursor: pointer; background: #3a3248; border-color: #5a4c70; }
    button:hover { background: #4a3f5c; }
    #note { padding: 8px 16px; color: var(--dim); font-size: 12px; border-bottom: 1px solid var(--line); }
    main { display: grid; gap: 16px; padding: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 640px), 1fr)); }
    .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .card h2 { margin: 0; padding: 8px 12px; font-size: 14px; display: flex; gap: 10px; flex-wrap: wrap; align-items: baseline; border-bottom: 1px solid var(--line); }
    .card h2 .tag { color: var(--dim); font-size: 12px; }
    .card canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; cursor: zoom-in; background: #000; }
    .stats { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; font-size: 12px; color: var(--dim); }
    .stats b { color: var(--ink); font-weight: normal; }
    .ok { color: var(--ok) !important; } .bad { color: var(--bad) !important; }
    .hist { display: flex; gap: 3px; align-items: end; height: 46px; padding: 0 12px 8px; margin-top: 4px; }
    .hist div { flex: 1; background: #6a8fd0; position: relative; min-height: 1px; }
    .hist div span { position: absolute; bottom: -14px; left: 0; right: 0; text-align: center; font-size: 9px; color: var(--dim); }
    .histwrap { padding-bottom: 14px; }
    #zoom { position: fixed; inset: 0; z-index: 5; background: rgba(0,0,0,.85); overflow: auto; display: none; cursor: zoom-out; }
    #zoom canvas { image-rendering: pixelated; }
    #busy { color: var(--accent); font-size: 12px; }
  </style>
  <script type="module" src="/src/forge/terrlab.js"></script>
</head>
<body>
  <header>
    <h1>지형 실험실</h1>
    <label>구역<select id="zone"></select></label>
    <label>시드 (쉼표로)<input id="seeds" value="1,2,3,4" /></label>
    <label>보기<select id="view"><option value="paint">게임 그림</option><option value="graph">구조 + 길찾기</option></select></label>
    <label>배율<select id="scale"><option value="0.25">1/4</option><option value="0.5">1/2</option><option value="1">1:1</option></select></label>
    <button id="go">만들기</button>
    <span id="busy"></span>
  </header>
  <div id="note">같은 구역을 여러 시드로 만들어 나란히 비교한다. 그림을 누르면 1:1로 크게 본다. 구조 보기: 초록 = 입구에서 갈 수 있는 바닥, 분홍 = 들어가면 못 나오는 곳(있으면 안 됨), 회색 = 닿지 않는 곳, 파랑 = 입구, 빨강 = ▶ 출구, 노랑 = ▲ 문, 주황 = ▼ 문.</div>
  <main id="out"></main>
  <div id="zoom"></div>
</body>
</html>
